<div class="min-h-screen bg-slate-50 text-slate-800 flex flex-col">
  
  <!-- Top Navigation Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
    <div class="px-4 sm:px-6 h-16 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <!-- Hamburger Menu Button -->
        <button 
          type="button" 
          (click)="toggleMenu()"
          class="p-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-colors focus:outline-none"
          aria-label="Toggle Navigation Drawer"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>

        <!-- Brand Logo -->
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-black text-lg shadow-sm">
            🐾
          </div>
          <div>
            <h1 class="font-bold text-slate-900 text-sm sm:text-base leading-tight">Pet Adoption Agency</h1>
            <p class="text-[11px] text-slate-500">Management Portal</p>
          </div>
        </div>
      </div>

    </div>
  </header>

  <!-- Dark Backdrop Overlay (Appears when drawer is open) -->
  @if (isMenuOpen()) {
    <div 
      (click)="toggleMenu()"
      class="fixed inset-0 top-16 bg-slate-900/30 backdrop-blur-xs z-40 transition-opacity"
    ></div>
  }

  <!-- Slide-Over Sidebar Drawer (Fixed Overlay) -->
  <aside 
    class="fixed top-16 left-0 bottom-0 w-72 bg-white border-r border-slate-200 z-50 transition-transform duration-300 ease-in-out shadow-2xl overflow-y-auto"
    [class.translate-x-0]="isMenuOpen()"
    [class.-translate-x-full]="!isMenuOpen()"
  >
    <div class="p-4 space-y-2">
      <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 px-3 mb-2">Navigation</p>

      <!-- Loop Through Configurable Sections -->
      @for (section of navConfig; track section.id) {
        <div class="rounded-xl border border-slate-100 overflow-hidden bg-slate-50/50">
          
          <!-- Section Header Toggle -->
          <button 
            type="button"
            (click)="toggleSection(section.id)"
            class="w-full flex items-center justify-between px-3.5 py-2.5 text-sm font-bold text-slate-700 hover:bg-slate-100 transition-colors"
          >
            <div class="flex items-center gap-2.5">
              <span class="text-base">{{ section.icon }}</span>
              <span>{{ section.title }}</span>
            </div>

            <svg 
              class="w-4 h-4 text-slate-400 transition-transform duration-200" 
              [class.rotate-180]="isSectionOpen(section.id)"
              fill="none" 
              stroke="currentColor" 
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- Dropdown Sub-routes -->
          @if (isSectionOpen(section.id)) {
            <div class="bg-white border-t border-slate-100 p-1.5 space-y-1">
              @for (item of section.items; track item.path) {
                <a 
                  [routerLink]="item.path"
                  routerLinkActive="bg-emerald-50 text-emerald-700 font-semibold border-emerald-500"
                  (click)="toggleMenu()"
                  class="flex items-center gap-2.5 px-3 py-2 rounded-lg text-xs sm:text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all border-l-2 border-transparent"
                >
                  @if (item.icon) {
                    <span>{{ item.icon }}</span>
                  }
                  <span>{{ item.label }}</span>
                </a>
              }
            </div>
          }

        </div>
      }
    </div>
  </aside>

  <!-- Main Viewport Shell (Stays fixed size underneath) -->
  <main class="flex-1 p-4 sm:p-6 lg:p-8 w-full max-w-7xl mx-auto">
    <div class="bg-white rounded-xl sm:rounded-2xl border border-slate-200 shadow-xs min-h-[calc(100vh-8rem)] p-4 sm:p-6">
      <router-outlet></router-outlet>
    </div>
  </main>

</div>
