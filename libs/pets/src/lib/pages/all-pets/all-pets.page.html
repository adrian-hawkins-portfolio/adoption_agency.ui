@if (loading$ | async) {
  <div class="flex justify-center items-center py-12">
    <p class="text-gray-500 text-lg font-medium">Loading pets...</p>
  </div>
} @else {
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 py-6">
    @for (pet of pets$ | async; track pet.id) {
      <lib-pet-card [pet]="pet" />
    } @empty {
      <p class="col-span-full text-center text-gray-500 py-12">No pets available right now.</p>
    }
  </div>
}
