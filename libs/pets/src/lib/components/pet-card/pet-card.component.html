<div class="flex flex-col h-full bg-white rounded-xl overflow-hidden border border-gray-200 shadow-sm hover:-translate-y-1 hover:shadow-md transition-all duration-200">
      <div class="relative w-full h-48 bg-gray-100">
        <img [src]="pet.image" [alt]="pet.name" class="w-full h-full object-cover" />
        @if (pet.status) {
          <span 
            class="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider text-white shadow-sm"
            [class.bg-emerald-500]="pet.status.toLowerCase() === 'available'"
            [class.bg-amber-500]="pet.status.toLowerCase() === 'pending'"
            [class.bg-gray-500]="pet.status.toLowerCase() === 'adopted'"
          >
            {{ pet.status }}
          </span>
        }
      </div>
      <div class="p-4 flex flex-col grow">
        <div class="flex justify-between items-center mb-2">
          <h3 class="m-0 text-xl font-bold text-gray-900">{{ pet.name }}</h3>
          <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded font-medium">
            {{ pet.species }}
          </span>
        </div>

        <p class="text-sm text-gray-500 mb-4 line-clamp-3 grow leading-relaxed">
          {{ pet.description }}
        </p>

        <a 
          [routerLink]="['/pets', pet.id]" 
          class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors duration-200"
        >
          View Pet
        </a>
      </div>
    </div>
